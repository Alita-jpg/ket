<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KET 闯关练习</title>
<style>
:root {
  --bg: #f7f4ee; --card: #ffffff; --fg: #1f1d1a; --muted: #6d6a64; --border: #e4dfd5;
  --accent: #b5561c; --accent-fg: #ffffff; --soft: #fbf0e6; --soft2: #eef4f8; --mark: #fff1b8;
  --bad: #b3432f; --mid: #9a6f0e; --good: #2e7d4f; --rec: #c0392b;
  --p1: #e3effb; --p2: #fbefd6; --p3: #fbe2df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --card: #211f1c; --fg: #eceae5; --muted: #a29f98; --border: #36332e;
    --accent: #f0a35e; --accent-fg: #1b1309; --soft: #33261a; --soft2: #1e2934; --mark: #5a4a12;
    --bad: #e0806e; --mid: #d8b04a; --good: #6cc38f; --rec: #ff6b5a;
    --p1: #1c2a39; --p2: #33291a; --p3: #3a2321;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --card: #211f1c; --fg: #eceae5; --muted: #a29f98; --border: #36332e;
  --accent: #f0a35e; --accent-fg: #1b1309; --soft: #33261a; --soft2: #1e2934; --mark: #5a4a12;
  --bad: #e0806e; --mid: #d8b04a; --good: #6cc38f; --rec: #ff6b5a;
  --p1: #1c2a39; --p2: #33291a; --p3: #3a2321;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
header h1 { font-size: 22px; margin: 4px 0 0; }
header .sub { color: var(--muted); font-size: 14px; }
nav { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
nav button { flex: 1; min-width: 64px; }
button, select, input, textarea { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
button, select { padding: 8px 12px; cursor: pointer; }
input[type=text], input[type=date] { padding: 8px 10px; }
textarea { width: 100%; padding: 10px; line-height: 1.5; resize: vertical; }
button:hover { border-color: var(--accent); }
button.primary, nav button.on, .seg button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.rec { color: var(--rec); border-color: var(--rec); }
button.rec.live { background: var(--rec); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
button.small { padding: 4px 10px; font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.big { font-size: 24px; font-weight: 700; margin: 6px 0; }
.q { font-size: 22px; line-height: 1.4; margin: 10px 0; font-weight: 600; }
.hidden { color: transparent !important; text-shadow: 0 0 10px var(--muted); user-select: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { flex: 1; }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; }
.timer.over { color: var(--bad); font-weight: 600; }
audio { width: 100%; margin-top: 6px; }
.ref { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.ref h4 { margin: 8px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.ref p { margin: 0 0 6px; }
.ans { font-size: 17px; white-space: pre-line; }
.tip { background: var(--soft2); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-top: 10px; }
.lbl { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.rate button { flex: 1; }
.rate .b1 { color: var(--bad); } .rate .b2 { color: var(--mid); } .rate .b3 { color: var(--good); }
.tag { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
.term { margin: 8px 0; line-height: 1.6; } .term b { font-size: 17px; }
.enans { font-size: 17px; margin: 6px 0 2px; }
.zhbox { background: var(--soft); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
.zhbox p { margin: 6px 0; font-size: 16px; line-height: 1.65; }
#hName { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background: var(--card); color: inherit; }
.tag.r1 { color: var(--bad); border-color: var(--bad); }
.tag.r2 { color: var(--mid); border-color: var(--mid); }
.tag.r3 { color: var(--good); border-color: var(--good); }
.tag.ph1 { background: var(--p1); } .tag.ph2 { background: var(--p2); } .tag.ph3 { background: var(--p3); }
.hint { font-size: 13px; color: var(--muted); }
label { font-size: 14px; color: var(--muted); }
input[type=range] { width: 160px; }
section[hidden] { display: none; }

.todo { list-style: none; padding: 0; margin: 12px 0; }
.todo li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--border); }
.todo li:first-child { border-top: 0; }
.todo .min { font-weight: 700; color: var(--accent); min-width: 58px; }
.todo .txt { flex: 1; min-width: 180px; }
.paw { width: 100%; font-size: 18px; padding: 12px; margin-top: 6px; }
.paw.done { border-color: var(--good); color: var(--good); }
.praise { text-align: center; font-size: 18px; color: var(--good); min-height: 28px; margin-top: 6px; }

table.grid { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
.grid th { font-size: 12px; color: var(--muted); font-weight: 600; }
.grid td { text-align: center; font-size: 13px; }
.grid td.wk { font-weight: 700; border-radius: 6px; }
.grid tr.p1 td.wk { background: var(--p1); } .grid tr.p2 td.wk { background: var(--p2); } .grid tr.p3 td.wk { background: var(--p3); }
.grid button { width: 100%; height: 30px; padding: 0; font-size: 15px; border-radius: 6px; }
.grid button.today { border: 2px solid var(--accent); }
.grid button.d { background: var(--soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px; }
.stat b { display: block; font-size: 20px; }

.word { font-size: 40px; font-weight: 700; text-align: center; margin: 14px 0 4px; letter-spacing: .5px; }
.zh { text-align: center; font-size: 22px; min-height: 36px; color: var(--muted); }
.reveal { width: 100%; margin: 8px 0; }
table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
.list td { border-top: 1px solid var(--border); padding: 6px 4px; vertical-align: middle; }
.list td:first-child { width: 44px; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }

.pics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
.pic { border: 1px solid var(--border); border-radius: 10px; text-align: center; padding: 8px 2px; }
.pic .e { font-size: 34px; line-height: 1.2; }
.pic .n { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.fu { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }

.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.panel { border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; }
.panel .no { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.panel .e { font-size: 30px; line-height: 1.3; }
.panel .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
.task { white-space: pre-line; background: var(--soft2); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; }
.checks label { display: block; color: var(--fg); margin: 4px 0; }
details { border-top: 1px solid var(--border); padding: 8px 0; }
details summary { cursor: pointer; }
.result { border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
.result.good { background: color-mix(in srgb, var(--good) 14%, transparent); }
.result.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.listen-in { font-size: 22px; width: 100%; text-align: center; letter-spacing: 1px; }

header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.hud { display: flex; align-items: center; gap: 6px; }
.hud button { padding: 6px 12px; border-radius: 999px; }
.pts { font-weight: 700; color: var(--mid); }
.lvbar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin: 6px 0 4px; }
.lvbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.goalbar { height: 14px; border-radius: 7px; background: var(--border); overflow: hidden; margin: 8px 0; }
.goalbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mid), var(--accent)); transition: width .5s; }
.today-pts { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.today-pts .n { font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1.1; }
.ev { font-size: 14px; color: var(--muted); margin: 3px 0; display: flex; justify-content: space-between; gap: 10px; }
.ev b { color: var(--mid); white-space: nowrap; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 12px; }
.badge .e { font-size: 30px; line-height: 1.2; }
.badge b { display: block; font-size: 13px; margin-top: 2px; }
.badge.lock { opacity: .45; filter: grayscale(1); }
.week7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week7 div { border: 1px solid var(--border); border-radius: 10px; padding: 6px 2px; font-size: 12px; color: var(--muted); }
.week7 b { display: block; font-size: 16px; color: var(--fg); }
.week7 .hit { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.week7 .now { outline: 2px solid var(--accent); }
.shop ul { list-style: none; padding: 0; margin: 0; }
.shop li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.shop li:first-child { border-top: 0; }
.shop .name { flex: 1; }
.shop .cost { color: var(--mid); font-weight: 700; white-space: nowrap; }
.lvcard { display: flex; gap: 16px; align-items: center; }
.lvcard .e { font-size: 60px; line-height: 1; }
#toasts { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 80; pointer-events: none; }
.toast { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.15); white-space: nowrap; animation: tIn .25s ease-out, tOut .4s ease-in 2.4s forwards; }
.float { position: fixed; left: 50%; top: 64px; font-size: 24px; font-weight: 800; color: var(--mid); pointer-events: none; z-index: 81; animation: floatUp 1.1s ease-out forwards; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 90; padding: 16px; }
.overlay .box { background: var(--card); color: var(--fg); border-radius: 18px; padding: 24px 28px; text-align: center; max-width: 340px; width: 100%; animation: pop .35s ease-out; }
.overlay .box .e { font-size: 64px; line-height: 1.1; }
.overlay .box .t { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
.confetti { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 91; animation: fall linear forwards; }
@keyframes tIn { from { opacity: 0; transform: translateY(-8px); } }
@keyframes tOut { to { opacity: 0; transform: translateY(-8px); } }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -56px) scale(1.4); } }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
@keyframes fall { to { transform: translateY(115vh) rotate(600deg); } }
@media (prefers-reduced-motion: reduce) {
  .toast, .float, .overlay .box { animation-duration: .01s !important; animation-delay: 0s !important; }
  .confetti { display: none; }
}

@media (max-width: 480px) {
  .q { font-size: 19px; }
  nav button { min-width: 0; flex: 1 1 30%; padding: 8px 4px; }
  .word { font-size: 32px; }
  .pics { grid-template-columns: repeat(3, 1fr); }
  .panel .e { font-size: 24px; }
  .grid button { height: 26px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>🐾 KET 闯关练习</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="hud">
    <button id="hudPts" title="积分、等级和奖励"><span id="hudLv">🐱 Lv1</span> · <span class="pts">⭐ <span id="hudN">0</span></span></button>
    <button id="hudGear" title="设置" aria-label="设置">⚙️</button>
  </div>
</header>
<nav id="nav">
  <button data-tab="today" class="on">今天</button>
  <button data-tab="words">单词</button>
  <button data-tab="speak">口语</button>
  <button data-tab="learn">📖 讲解</button>
  <button data-tab="host">🎤 擂主</button>
  <button data-tab="listen">听力</button>
  <button data-tab="write">写作</button>
  <button data-tab="reward">奖励</button>
</nav>
<section id="today"></section>
<section id="words" hidden></section>
<section id="speak" hidden></section>
<section id="learn" hidden></section>
<section id="host" hidden></section>
<section id="listen" hidden></section>
<section id="write" hidden></section>
<section id="reward" hidden></section>
<section id="settings" hidden></section>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";

// ===== 小工具 =====
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("ket." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ket." + k, JSON.stringify(v)); } catch (e) {} }
};
const PRAISE = ["太棒了！🐾", "Great job! ⭐", "又进步了一点！", "Well done! 🎉", "小爪印 +1 🐾", "Super! 继续保持 💪"];
const WD = ["一", "二", "三", "四", "五", "六", "日"];
const parseDate = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const fmtMD = d => `${d.getMonth() + 1}/${d.getDate()}`;
const fmtSec = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const countWords = t => (t.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;

// ===== 12 周计划（和训练计划一致）=====
const p2w = (topic, grammar, sat) => ({ topic, grammar, days: [
  "阅读：练错得多的那部分", "听力：练错得多的那部分，做完看原文跟读 5 分钟", "写作：写一篇 ⑥ 或 ⑦，改完重抄一遍",
  `阅读 ④⑤ 填空 ＋ 语法：${grammar}`, "口语：拿话题卡片练第 1、2 部分", sat, "休息"] });
const p3w = (topic, grammar, n) => ({ topic, grammar, days: [
  "订正上周六的阅读错题", "听力错题：看原文再听一遍", "重写上周六的作文",
  `错词本 ＋ 语法：${grammar}`, "口语模拟", `整套模考 ${n}：阅读写作 60 分钟，休息 10 分钟，听力 30 分钟`, "口语模拟 10 分钟"] });
const SAT_RW = "阅读写作全卷，限时 60 分钟", SAT_L = "听力全卷 30 分钟 ＋ 口语模拟";
const WEEKS = [
  { topic: "Family and friends · Personal feelings", grammar: "比赛周，不学新的", days: [
    "🎤 擂主周：先在「🎤 擂主」页练熟话术 9 句；「📖 讲解」看懂 A1，口语页跟读 A1（APEC 第 1–15 题）", "🎤 「📖 讲解」看懂 A2，口语页跟读 A2（APEC 第 16–30 题）；擂主演练 2 轮",
    "🎤 「📖 讲解」看懂 B，口语页跟读 B（外交与礼仪第 31–45 题）；擂主演练 2 轮", "🎤 「📖 讲解」看懂 C、E，口语页跟读（世界地理 ＋ 历史文化，第 46–58、69–74 题）；擂主演练 2 轮",
    "🎤 「📖 讲解」看懂 D、F，口语页跟读（科学常识 ＋ 数理生活，第 59–68、75–85 题）；擂主演练 2 轮", "🎤 擂主演练 3–5 轮（选「只抽还没熟的」）；做好 ✔ ✘ 两块举牌，穿上礼服彩排一遍",
    "🏆 下午当擂主！上午轻松演练一轮：说慢一点、声音大一点、看着人说"] },
  { topic: "Education · Time", grammar: "一般过去时，不规则动词", days: [
    "阅读 ① 告示、② 配对", "听力 ① 看图、② 填笔记", "写作 ⑥ 邮件：3 个问题都要答到",
    "阅读 ④⑤ 填空 ＋ 语法：一般过去时", "口语第 1 部分：介绍自己", "阅读 ①–⑤，限时 40 分钟", "休息"] },
  { topic: "Hobbies and leisure · Sport", grammar: "一般现在时和现在进行时", days: [
    "阅读 ③ 长文章", "听力 ③、④", "写作 ⑦ 看图故事：用过去时",
    "阅读 ④⑤ 填空 ＋ 语法：现在时", "口语：Tell me something about…，说 3 句以上", "听力全卷，30 分钟", "休息"] },
  { topic: "Food and drink · Shopping · Measurements", grammar: "比较级、最高级", days: [
    "阅读 ④⑤ 填空", "听力 ⑤ 配对", "写作 ⑥⑦ 各一篇，用上 and / but / because / so",
    "阅读 ④⑤ 填空 ＋ 语法：比较级", "口语第 2 部分：看图讨论", "阅读 ＋ 写作，限时 60 分钟", "休息"] },
  p2w("House and home · Appliances · Colours", "将来时 will / going to", SAT_RW),
  p2w("Town and city · Buildings · Services", "can / must / have to / should", SAT_L),
  p2w("Travel and transport · Weather", "时间和地点介词 at / on / in", SAT_RW),
  p2w("Entertainment and media · Communication and technology", "现在完成时 ever / never / just / already", SAT_L),
  p2w("Health and exercise · Natural world · Countryside", "some / any / much / many / a lot of", SAT_RW),
  p3w("Clothes · Work and jobs · Documents and texts", "疑问词和代词 who / which / whose", "①"),
  p3w("错词本全部过一遍", "复习错得多的", "②"),
  { topic: "错词本 · 不规则动词表", grammar: "不学新的", days: [
    "模考 ③：阅读写作 60 分钟", "模考 ③：听力 30 分钟", "订正模考 ③", "看错题本和改过的作文",
    "口语轻松聊 10 分钟", "不做新题，看错题本", "休息，早点睡"] }
];
const phase = w => w <= 4 ? 1 : w <= 9 ? 2 : 3;

// ===== 单词：按周的话题，Flyers 学过的点「早就会」跳过 =====
const VOCAB = {
1: `aunt|阿姨；姑姑
uncle|叔叔；舅舅
cousin|堂（表）兄弟姐妹
grandparents|祖父母；外祖父母
parents|父母
husband|丈夫
wife|妻子
son|儿子
daughter|女儿
grandson|孙子；外孙
granddaughter|孙女；外孙女
neighbour|邻居

function award(n, label, key, type) {

  if (key) { if (PT.got.keys.includes(key)) return 0; PT.got.keys.push(key); }
  const d = PT.days[day] || (PT.days[day] = { p: 0, ev: [], t: {} });
  if (type) { d.t = d.t || {}; d.t[type] = true; }
  if (!n) { savePT(); return 0; }
  const lvBefore = levelOf(PT.total).i, before = d.p;
  d.p += n; PT.total += n;

const synth = window.speechSynthesis;

// 挑声音：试听后觉得 Samantha 最清楚，优先用它（有「增强版」就用增强版）；其次别的增强版、Google 声音、Daniel，最后才是别的英文声音
function bestVoice() {
  for (const re of [/Samantha.*(Premium|Enhanced)|(Premium|Enhanced).*Samantha/i, /Samantha/, /Premium|Enhanced|Siri/i, /Google US English|Google UK English/, /Daniel/, /Serena|Kate|Karen|Moira/, /Martha|Arthur/]) {
    const v = voices.find(x => re.test(x.name)); if (v) return v;
  }

}
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (voices.length) {
    if (settings.ver < 3) {   // 一次性：把旧版保存的偏慢语速（太慢会发糊）和旧的默认声音换成新的
      settings.ver = 3; if (settings.rate < 1) settings.rate = 1;
      const b = bestVoice(); if (b) settings.voice = b.name;
      saveSettings();
    } else if (!settings.voice || !voices.some(v => v.name === settings.voice)) {
      const b = bestVoice(); if (b) settings.voice = b.name;

}

function speakQueue(parts, onend) {
  if (!synth) { onend && onend(); return; }
  synth.cancel(); keep = [];
  const v = voices.find(x => x.name === settings.voice);
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    u.rate = settings.rate * (p.length <= 9 ? 0.95 : 1);

let activeRec = null, tickIv = null;
function makeRecorder(onStop) {
  let mr = null, chunks = [], stream = null, t0 = 0, iv = null;
  return {
    get live() { return !!mr && mr.state === "recording"; },
    async start(timerEl) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = []; mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop()); clearInterval(iv);
        const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
        onStop(URL.createObjectURL(blob), Math.round((Date.now() - t0) / 1000));
      };
      mr.start(); t0 = Date.now();
      iv = setInterval(() => { timerEl.textContent = fmtSec((Date.now() - t0) / 1000); }, 250);
    },
    stop() { if (mr && mr.state === "recording") mr.stop(); }
  };
}
function recWidget(holder, onUrl) {
  if (!holder) return;
  if (!window.MediaRecorder || !navigator.mediaDevices) { holder.innerHTML = `<p class="hint">这个浏览器不能录音，换 Chrome 或 Safari 试试。</p>`; return; }
  holder.innerHTML = `<div class="row"><button class="rec">🎙 录音</button><span class="timer">0:00</span></div><audio controls hidden></audio><p class="hint err" hidden></p>`;
  const b = $(".rec", holder), tm = $(".timer", holder), au = $("audio", holder), er = $(".err", holder);
  const r = makeRecorder((url, secs) => {
    b.classList.remove("live"); b.textContent = "🎙 重新录"; au.src = url; au.hidden = false;
    if (activeRec === r) activeRec = null;
    onUrl && onUrl(url, secs);
  });
  b.onclick = async () => {
    if (r.live) { r.stop(); return; }
    if (activeRec) activeRec.stop();
    stopSpeech();
    try { await r.start(tm); activeRec = r; b.classList.add("live"); b.textContent = "⏹ 停止"; er.hidden = true; }
    catch (e) { er.hidden = false; er.textContent = "麦克风用不了：请在浏览器里允许使用麦克风，再点一次。"; }
  };
}
function countdown(holder, secs) {
  holder.innerHTML = `<button class="cd">⏱ 开始 ${secs / 60} 分钟</button> <span class="timer"></span>`;
  const b = $(".cd", holder), t = $(".timer", holder);
  b.onclick = () => {
    clearInterval(tickIv); let left = secs; t.classList.remove("over"); t.textContent = fmtSec(left);
    tickIv = setInterval(() => { left--; t.textContent = fmtSec(Math.max(left, 0)); if (left <= 0) { clearInterval(tickIv); t.textContent = "时间到！"; t.classList.add("over"); } }, 1000);
  };
}

function wireWords(el) {
  const x = wv.q && wv.q[wv.i];
  const again = $("#wAgain", el); if (again) again.onclick = () => { wv.q = null; RENDER.words(); };
  $$("[data-say]", el).forEach(b => b.onclick = () => speak(b.dataset.say));
  $$("input[data-m]", el).forEach(c => c.onchange = () => { markWord(c.dataset.m, c.checked ? "m" : "unm"); RENDER.words(); });
  if (!x || wv.mode === "list") return;
  const next = (res) => {
    wv.res.push(res); wv.i++; wv.shown = false; wv.checked = null;
    if (wv.i >= wv.q.length) {
      award(3, wv.mode === "spell" ? "听写做完一轮" : "闪卡做完一轮", null, "words");
      if (wv.mode === "spell" && wv.res.length >= 5 && wv.res.every(Boolean)) { bump("spellPerfect"); award(5, "听写一轮全对！", null, "words"); }
    }
    RENDER.words();
  };
  $$("[data-a]", el).forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "say") speak(x.en);
    else if (a === "show") { wv.shown = true; RENDER.words(); }
    else if (a === "yes" || a === "no") { markWord(x.id, a); award(1, `单词 ${x.en}`, "wc:" + x.id, "words"); next(a === "yes"); }
    else if (a === "m") { markWord(x.id, "m"); next(true); }
    else if (a === "check") checkSpell();
    else if (a === "next") next(wv.checked.ok);
  });
  const inp = $("#spIn", el);
  if (inp) { if (!wv.checked) inp.focus(); inp.onkeydown = e => { if (e.key === "Enter") { if (wv.checked) next(wv.checked.ok); else checkSpell(); } }; }
  if (wv.mode === "card" && !wv.shown) speak(x.en);
  if (wv.mode === "spell" && !wv.checked) speak(x.en);
  function checkSpell() {
    const v = $("#spIn").value.trim();
    const ok = v.toLowerCase().replace(/\s+/g, " ") === x.en.toLowerCase();
    markWord(x.id, ok ? "yes" : "no"); wv.checked = { ok, v };
    if (ok) award(2, `听写 ${x.en}`, "ws:" + x.id, "words");
    RENDER.words();
    $("#words [data-a=next]").focus();
    if (!ok) speak(x.en);
  }
}

    stopSpeech(); RENDER.listen();
  };
  const next = () => {
    stopSpeech(); r.i++;
    if (r.i >= r.items.length && !r.awarded) {
      r.awarded = true; award(3, "听力做完一组", null, "listen");
      if (r.right === r.items.length) { bump("listenPerfect"); award(5, "听力一组全对！", null, "listen"); }
    }
    RENDER.listen();
  };
  $$("[data-a]", el).forEach(b => b.onclick = () => {
    const a = b.dataset.a; if (a === "play") playTwice(it.say); else if (a === "check") check(); else if (a === "next") next();
  });
  inp.onkeydown = e => { if (e.key === "Enter") { if (it.checked) next(); else check(); } };
  if (it.checked) { const n = $("#listen [data-a=next]"); if (n) { n.focus(); n.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); next(); } }; } }
  else { inp.focus(); playTwice(it.say); }
};

// ===== 写作 =====
const wt = { part: 6, i: 0, model: false };
RENDER.write = function () {
  renderSub();
  const el = $("#write"), list = wt.part === 6 ? W6 : W7, p = list[wt.i], key = `${wt.part}-${wt.i}`, need = wt.part === 6 ? 25 : 35;
  const text = DR[key] || "", n = countWords(text);
  const checks = wt.part === 6 ? [...p.pts, "开头有 Hi / Dear ＋ 名字，结尾署名"] : ["三幅图都写到了", "用的是过去时（went, saw, was…）", "写了结果或心情", "用了 First / Then / In the end 这类词"];
  const saved = WR.filter(w => w.part === wt.part && w.i === wt.i).length;
  let h = `<div class="seg"><button data-p="6" class="${wt.part === 6 ? "on" : ""}">⑥ 写邮件</button><button data-p="7" class="${wt.part === 7 ? "on" : ""}">⑦ 看图写故事</button></div>
    <div class="row"><select id="wSel" style="flex:1">${list.map((x, i) => `<option value="${i}" ${i === wt.i ? "selected" : ""}>${i + 1}. ${esc(x.title)}${WR.some(w => w.part === wt.part && w.i === i) ? " ✓" : ""}</option>`).join("")}</select><button id="wRnd">🎲 随机</button></div>
    <div class="card">
      <div class="meta"><span>${wt.part === 6 ? "第 6 部分 · 邮件或便条" : "第 7 部分 · 看图写故事"}</span>${saved ? `<span class="tag r3">写过 ${saved} 次</span>` : ""}</div>`;
  if (wt.part === 6) h += `<div class="task">${esc(p.task)}</div><p class="hint">要写到的三件事：${p.pts.map(esc).join(" / ")}</p>`;
  else h += `<div class="task">Look at the three pictures. Write the story shown in the pictures.\nWrite 35 words or more.</div>
      <div class="panels">${p.panels.map(([e, d], i) => `<div class="panel"><span class="no">图 ${i + 1}</span><div class="e">${e}</div><div class="d">${esc(d)}</div></div>`).join("")}</div>
      <p class="hint">可能用到的词：${esc(p.words)}</p>`;
  h += `<label class="lbl" for="wTxt">我写的（自动保存草稿）</label>
      <textarea id="wTxt" rows="7" spellcheck="false" placeholder="${wt.part === 6 ? "Hi …," : "One day, …"}">${esc(text)}</textarea>
      <div class="row"><span class="count" id="wCnt" style="color:${n >= need ? "var(--good)" : "var(--muted)"}">${n} 词 / 至少 ${need} 词</span></div>
      <div class="checks">${checks.map(c => `<label><input type="checkbox"> ${esc(c)}</label>`).join("")}</div>
      <div class="row">
        <button class="primary" data-a="save">保存这一篇</button>
        <button data-a="copy">📋 复制给 ChatGPT 批改</button>
        <button data-a="model">${wt.model ? "收起范文" : "写完再看范文"}</button>
      </div>
      <div class="hint" id="wMsg"></div>
      <div class="ref" ${wt.model ? "" : "hidden"}><h4>范文（${countWords(p.model)} 词）</h4><p class="ans">${esc(p.model)}</p></div>
    </div>`;
  const mine = WR.filter(w => w.part === wt.part);
  if (mine.length) h += `<div class="card"><h4 style="margin:0 0 6px">我写过的（第 ${wt.part} 部分，共 ${mine.length} 篇）</h4>${mine.map(w => `<details><summary>${new Date(w.t).toLocaleDateString("zh-CN")} · ${esc(w.title)} · ${w.n} 词</summary><p class="ans">${esc(w.text)}</p><button class="small" data-del="${w.t}">删掉</button></details>`).join("")}</div>`;
  el.innerHTML = h;
  $$(".seg button", el).forEach(b => b.onclick = () => { wt.part = Number(b.dataset.p); wt.i = 0; wt.model = false; RENDER.write(); });
  $("#wSel").onchange = e => { wt.i = Number(e.target.value); wt.model = false; RENDER.write(); };
  $("#wRnd").onclick = () => { wt.i = Math.floor(Math.random() * list.length); wt.model = false; RENDER.write(); };
  const ta = $("#wTxt"), cnt = $("#wCnt"), msg = $("#wMsg");
  ta.oninput = () => { DR[key] = ta.value; store.set("drafts", DR); const k = countWords(ta.value); cnt.textContent = `${k} 词 / 至少 ${need} 词`; cnt.style.color = k >= need ? "var(--good)" : "var(--muted)"; };
  $$("[data-del]", el).forEach(b => b.onclick = () => { if (!confirm("删掉这一篇？")) return; WR = WR.filter(w => String(w.t) !== b.dataset.del); store.set("wr", WR); RENDER.write(); });
  $$("[data-a]", el).forEach(b => b.onclick = () => {
    const a = b.dataset.a, v = ta.value.trim();
    if (a === "model") { wt.model = !wt.model; RENDER.write(); }
    else if (a === "save") {
      if (!v) { msg.textContent = "先写一点再保存哦。"; return; }
      const nn = countWords(v), full = nn >= need;
      WR.unshift({ part: wt.part, i: wt.i, title: p.title, text: v, n: nn, t: Date.now() }); store.set("wr", WR);
      delete DR[key]; store.set("drafts", DR);
      const got = award(full ? 12 : 4, `作文：${p.title}`, `wr:${key}:${full ? "full" : "short"}`, "write"); checkBadges();
      RENDER.write();
      $("#wMsg").textContent = rnd(PRAISE) + " 已保存。" + (got ? ` +${got} ⭐` : "（这一题今天已经加过分了）") + (full ? "" : ` 写够 ${need} 词能拿 12 分哦。`);
    } else if (a === "copy") {
      if (!v) { msg.textContent = "先写一点再复制。"; return; }
      const task = wt.part === 6 ? p.task : `看三幅图写故事（35 词以上）。图 1：${p.panels[0][1]}；图 2：${p.panels[1][1]}；图 3：${p.panels[2][1]}。`;
      const txt = `你是剑桥 A2 Key for Schools 的写作老师。下面是我写的第 ${wt.part} 部分${wt.part === 6 ? "邮件" : "看图故事"}，题目是：\n${task}\n\n我写的：\n${v}\n\n${GPT_ASK}`;
      copyText(txt).then(ok => { msg.textContent = ok ? "已复制。打开 ChatGPT，粘贴发送就行。" : "复制没成功，可以手动全选文字复制。"; });
    }
  });
};
function copyText(t) {
  const fallback = () => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} a.remove(); return ok; };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(() => true, () => fallback());
  return Promise.resolve(fallback());
}

// ===== 奖励：等级、这一周、徽章、奖励商店、积分规则 =====
RENDER.reward = function () {
  renderSub(); renderHUD();
  const el = $("#reward"), lv = levelOf(PT.total), avail = PT.total - PT.spent;
  const pct = lv.next ? Math.round((PT.total - lv.min) / (lv.next - lv.min) * 100) : 100;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); const k = dkey(d); return { k, p: (PT.days[k] || {}).p || 0 }; });
  const gotN = BADGES.filter(b => PT.badges[b.id]).length;
  el.innerHTML = `<div class="card"><div class="lvcard"><div class="e">${lv.e}</div><div style="flex:1">
      <div class="meta">我的等级</div><div class="big" style="margin:0">Lv${lv.i + 1} ${esc(lv.name)}</div>
      <div class="lvbar"><i style="width:${pct}%"></i></div>
      <div class="hint">${lv.next ? `总积分 ${PT.total}，再拿 ${lv.next - PT.total} 分升到 Lv${lv.i + 2}「${esc(LEVELS[lv.i + 1][2])}」` : `总积分 ${PT.total}，已经是最高级了！`}</div>
    </div></div></div>
  <div class="card"><div class="meta" style="margin-bottom:8px"><span>这一周 共 ${week.reduce((a, x) => a + x.p, 0)} 分</span><span>🔥 连续打卡 ${streak()} 天</span></div>
    <div class="week7">${week.map((x, i) => `<div class="${x.p >= settings.goal ? "hit" : ""} ${x.k === todayKey() ? "now" : ""}">周${WD[i]}<b>${x.p}</b>${x.p >= settings.goal ? "🎯" : "&nbsp;"}</div>`).join("")}</div>
    <p class="hint">一天拿到 ${settings.goal} 分，就完成了今日目标 🎯。</p></div>
  <div class="card"><div class="meta" style="margin-bottom:8px"><span>徽章 ${gotN} / ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => `<div class="badge ${PT.badges[b.id] ? "" : "lock"}"><div class="e">${b.e}</div><b>${esc(b.name)}</b><span class="hint">${PT.badges[b.id] ? PT.badges[b.id].slice(5).replace("-", "/") + " 拿到" : esc(b.tip)}</span></div>`).join("")}</div></div>
  <div class="card shop"><div class="meta" style="margin-bottom:6px"><span>奖励商店</span><span class="pts">可以用的 ⭐ ${avail}</span></div>
    <ul>${PT.rewards.length ? PT.rewards.map((r, i) => `<li><span class="name">${esc(r.name)}</span><span class="cost">${r.cost} ⭐</span><button class="small ${avail >= r.cost ? "primary" : ""}" data-buy="${i}" ${avail >= r.cost ? "" : "disabled"}>兑换</button><button class="small" data-delr="${i}" aria-label="删掉这个奖励">✕</button></li>`).join("") : `<li class="hint">还没有奖励，爸爸妈妈可以在下面加。</li>`}</ul>
    <details><summary>爸爸妈妈：加一个奖励</summary><div class="row"><input type="text" id="rName" placeholder="比如：周末多玩 30 分钟" style="flex:1;min-width:160px"><input type="number" id="rCost" placeholder="积分" min="1" style="width:90px;padding:8px"><button id="rAdd">加上</button></div></details>
    ${PT.redeemed.length ? `<details><summary>兑换记录（${PT.redeemed.length} 次）</summary>${PT.redeemed.map(x => `<div class="ev"><span>${new Date(x.t).toLocaleDateString("zh-CN")} ${esc(x.name)}</span><b>−${x.cost}</b></div>`).join("")}</details>` : ""}
  </div>
  <div class="card"><details open><summary><b>怎么拿积分</b></summary>${RULES.map(([a, b]) => `<div class="ev"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("")}
    <p class="hint">同一个词、同一道口语题、同一篇作文，一天只算一次分。等级看总积分，兑换奖励花掉的分不会让等级掉下来。</p></details></div>`;
  $$("[data-buy]", el).forEach(b => b.onclick = () => {
    const r = PT.rewards[Number(b.dataset.buy)];
    if (!r || PT.total - PT.spent < r.cost) return;
    if (!confirm(`用 ${r.cost} 分兑换「${r.name}」？请爸爸妈妈确认。`)) return;
    PT.spent += r.cost; PT.redeemed.unshift({ name: r.name, cost: r.cost, t: Date.now() }); savePT(); renderHUD();
    celebrate("🎁", "兑换成功！", r.name); RENDER.reward();
  });
  $$("[data-delr]", el).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.delr); if (!confirm(`删掉奖励「${PT.rewards[i].name}」？`)) return;
    PT.rewards.splice(i, 1); savePT(); RENDER.reward();
  });
  $("#rAdd", el).onclick = () => {
    const name = $("#rName", el).value.trim(), cost = Math.round(Number($("#rCost", el).value));
    if (!name || !(cost > 0)) { alert("写上奖励和需要的积分"); return; }
    PT.rewards.push({ name, cost }); PT.rewards.sort((a, b) => a.cost - b.cost); savePT(); RENDER.reward();
  };
};

// ===== 设置 =====
RENDER.settings = function () {
  renderSub();
  const el = $("#settings");
  el.innerHTML = `<div class="card">
    <div class="row"><label style="min-width:72px">语速</label><input type="range" id="sRate" min="0.6" max="1.1" step="0.05" value="${settings.rate}"><span class="hint" id="sRateV">${settings.rate.toFixed(2)}</span></div>
    <div class="row"><label style="min-width:72px">声音</label><select id="sVoice" style="flex:1">${voices.length ? voices.map(v => `<option ${v.name === settings.voice ? "selected" : ""}>${esc(v.name)}</option>`).join("") : "<option>（没找到英文声音）</option>"}</select><button id="sTest">试听</button></div>
    <p class="hint">默认用 Samantha（美式口音，听起来最清楚）。剑桥考试多是英式口音，想听英式可以选带 en-GB 的声音（比如 Daniel）。</p>
    <p class="hint">声音发糊、听不清时：先把语速调到 1.0（太慢反而会糊），再点「试听」换几个声音比一比。iPad 还可以下载更清晰的「增强版」声音：设置 → 辅助功能 → 朗读内容 → 声音 → 英语，选 Samantha 或 Daniel，下载「增强版」（不同系统版本的菜单名字可能略有不同）；下载好后回到这里，声音列表里会多出带「增强版」的声音，选它。</p>
    <div class="row"><label><input type="checkbox" id="sListen" ${settings.listenOnly ? "checked" : ""}> 口语题只听不看（题目文字先模糊，点「看题目」才显示）</label></div>
  </div>
  <div class="card">
    <div class="row"><label style="min-width:72px">开始日期</label><input type="date" id="sStart" value="${settings.start}"></div>
    <div class="row"><label style="min-width:72px">考试日期</label><input type="date" id="sExam" value="${settings.exam}"><span class="hint">定了就填，顶上会倒计时</span></div>
  </div>
  <div class="card">
    <div class="row"><label style="min-width:72px">每日目标</label><input type="number" id="sGoal" min="10" max="200" step="5" value="${settings.goal}" style="width:90px;padding:8px"><span class="hint">一天拿到这么多分算完成，默认 40</span></div>
    <div class="row"><label><input type="checkbox" id="sSound" ${settings.sound ? "checked" : ""}> 拿积分时有提示音</label></div>
  </div>
  <div class="card">
    <p class="hint">进度只存在这台电脑的这个浏览器里。换电脑前先导出，到新电脑上导入。</p>
    <div class="row"><button id="sExport">导出进度</button><label class="small" style="border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer">导入进度<input type="file" id="sImport" accept=".json,application/json" hidden></label></div>
    <div class="row"><button id="sReset" style="color:var(--bad)">清空所有记录</button></div>
  </div>`;
  $("#sRate").oninput = e => { settings.rate = Number(e.target.value); $("#sRateV").textContent = settings.rate.toFixed(2); saveSettings(); };
  $("#sVoice").onchange = e => { settings.voice = e.target.value; saveSettings(); };
  $("#sTest").onclick = () => speak("Hello! Let's practise for the Key exam. Can you spell your name, please?");
  $("#sListen").onchange = e => { settings.listenOnly = e.target.checked; saveSettings(); };
  $("#sStart").onchange = e => { if (e.target.value) { settings.start = e.target.value; saveSettings(); renderSub(); } };
  $("#sExam").onchange = e => { settings.exam = e.target.value; saveSettings(); renderSub(); };
  $("#sGoal").onchange = e => { const g = Math.round(Number(e.target.value)); if (g >= 10 && g <= 200) { settings.goal = g; saveSettings(); } else e.target.value = settings.goal; };
  $("#sSound").onchange = e => { settings.sound = e.target.checked; saveSettings(); if (settings.sound) chime(false); };
  $("#sExport").onclick = () => {
    const data = {}; ["settings", "done", "words", "sp", "my", "ls", "wr", "drafts", "ltypes", "pts"].forEach(k => data[k] = store.get(k, null));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
    a.download = `KET 进度 ${new Date().toISOString().slice(0, 10)}.json`; a.click();
  };
  $("#sImport").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); Object.keys(d).forEach(k => { if (d[k] != null) store.set(k, d[k]); }); location.reload(); }).catch(() => alert("这个文件读不出来。"));
  };
  $("#sReset").onclick = () => {
    if (!confirm("清空所有打卡、积分、徽章、单词、口语、听力和作文记录？清空后找不回来。")) return;
    ["done", "words", "sp", "my", "ls", "wr", "drafts", "pts"].forEach(k => store.set(k, k === "wr" ? [] : {}));
    location.reload();
  };
};

$("#hudPts").onclick = () => showTab("reward");
$("#hudGear").onclick = () => showTab("settings");
renderHUD();
showTab(store.get("tab", "today"));
})();
</script>
