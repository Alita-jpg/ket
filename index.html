<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KET 闯关练习</title>
<style>
:root {
  --bg: #f7f4ee; --card: #ffffff; --fg: #1f1d1a; --muted: #6d6a64; --border: #e4dfd5;
  --accent: #b5561c; --accent-fg: #ffffff; --soft: #fbf0e6; --soft2: #eef4f8; --mark: #fff1b8;
  --bad: #b3432f; --mid: #9a6f0e; --good: #2e7d4f; --rec: #c0392b;
  --p1: #e3effb; --p2: #fbefd6; --p3: #fbe2df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --card: #211f1c; --fg: #eceae5; --muted: #a29f98; --border: #36332e;
    --accent: #f0a35e; --accent-fg: #1b1309; --soft: #33261a; --soft2: #1e2934; --mark: #5a4a12;
    --bad: #e0806e; --mid: #d8b04a; --good: #6cc38f; --rec: #ff6b5a;
    --p1: #1c2a39; --p2: #33291a; --p3: #3a2321;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --card: #211f1c; --fg: #eceae5; --muted: #a29f98; --border: #36332e;
  --accent: #f0a35e; --accent-fg: #1b1309; --soft: #33261a; --soft2: #1e2934; --mark: #5a4a12;
  --bad: #e0806e; --mid: #d8b04a; --good: #6cc38f; --rec: #ff6b5a;
  --p1: #1c2a39; --p2: #33291a; --p3: #3a2321;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
header h1 { font-size: 22px; margin: 4px 0 0; }
header .sub { color: var(--muted); font-size: 14px; }
nav { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
nav button { flex: 1; min-width: 64px; }
button, select, input, textarea { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
button, select { padding: 8px 12px; cursor: pointer; }
input[type=text], input[type=date] { padding: 8px 10px; }
textarea { width: 100%; padding: 10px; line-height: 1.5; resize: vertical; }
button:hover { border-color: var(--accent); }
button.primary, nav button.on, .seg button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.rec { color: var(--rec); border-color: var(--rec); }
button.rec.live { background: var(--rec); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
button.small { padding: 4px 10px; font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.big { font-size: 24px; font-weight: 700; margin: 6px 0; }
.q { font-size: 22px; line-height: 1.4; margin: 10px 0; font-weight: 600; }
.hidden { color: transparent !important; text-shadow: 0 0 10px var(--muted); user-select: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { flex: 1; }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; }
.timer.over { color: var(--bad); font-weight: 600; }
audio { width: 100%; margin-top: 6px; }
.ref { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.ref h4 { margin: 8px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.ref p { margin: 0 0 6px; }
.ans { font-size: 17px; white-space: pre-line; }
.tip { background: var(--soft2); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-top: 10px; }
.lbl { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.rate button { flex: 1; }
.rate .b1 { color: var(--bad); } .rate .b2 { color: var(--mid); } .rate .b3 { color: var(--good); }
.tag { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
.tag.r1 { color: var(--bad); border-color: var(--bad); }
.tag.r2 { color: var(--mid); border-color: var(--mid); }
.tag.r3 { color: var(--good); border-color: var(--good); }
.tag.ph1 { background: var(--p1); } .tag.ph2 { background: var(--p2); } .tag.ph3 { background: var(--p3); }
.hint { font-size: 13px; color: var(--muted); }
label { font-size: 14px; color: var(--muted); }
input[type=range] { width: 160px; }
section[hidden] { display: none; }

.todo { list-style: none; padding: 0; margin: 12px 0; }
.todo li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--border); }
.todo li:first-child { border-top: 0; }
.todo .min { font-weight: 700; color: var(--accent); min-width: 58px; }
.todo .txt { flex: 1; min-width: 180px; }
.paw { width: 100%; font-size: 18px; padding: 12px; margin-top: 6px; }
.paw.done { border-color: var(--good); color: var(--good); }
.praise { text-align: center; font-size: 18px; color: var(--good); min-height: 28px; margin-top: 6px; }

table.grid { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
.grid th { font-size: 12px; color: var(--muted); font-weight: 600; }
.grid td { text-align: center; font-size: 13px; }
.grid td.wk { font-weight: 700; border-radius: 6px; }
.grid tr.p1 td.wk { background: var(--p1); } .grid tr.p2 td.wk { background: var(--p2); } .grid tr.p3 td.wk { background: var(--p3); }
.grid button { width: 100%; height: 30px; padding: 0; font-size: 15px; border-radius: 6px; }
.grid button.today { border: 2px solid var(--accent); }
.grid button.d { background: var(--soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px; }
.stat b { display: block; font-size: 20px; }

.word { font-size: 40px; font-weight: 700; text-align: center; margin: 14px 0 4px; letter-spacing: .5px; }
.zh { text-align: center; font-size: 22px; min-height: 36px; color: var(--muted); }
.reveal { width: 100%; margin: 8px 0; }
table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
.list td { border-top: 1px solid var(--border); padding: 6px 4px; vertical-align: middle; }
.list td:first-child { width: 44px; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }

.pics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
.pic { border: 1px solid var(--border); border-radius: 10px; text-align: center; padding: 8px 2px; }
.pic .e { font-size: 34px; line-height: 1.2; }
.pic .n { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.fu { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }

.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.panel { border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; }
.panel .no { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.panel .e { font-size: 30px; line-height: 1.3; }
.panel .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
.task { white-space: pre-line; background: var(--soft2); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; }
.checks label { display: block; color: var(--fg); margin: 4px 0; }
details { border-top: 1px solid var(--border); padding: 8px 0; }
details summary { cursor: pointer; }
.result { border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
.result.good { background: color-mix(in srgb, var(--good) 14%, transparent); }
.result.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.listen-in { font-size: 22px; width: 100%; text-align: center; letter-spacing: 1px; }

@media (max-width: 480px) {
  .q { font-size: 19px; }
  nav button { min-width: 0; flex: 1 1 30%; padding: 8px 4px; }
  .word { font-size: 32px; }
  .pics { grid-template-columns: repeat(3, 1fr); }
  .panel .e { font-size: 24px; }
  .grid button { height: 26px; font-size: 13px; }
}
</style>
</head>

<div class="wrap">
<header>
  <h1>🐾 KET 闯关练习</h1>
  <div class="sub" id="sub"></div>

  <button data-tab="listen">听力</button>
  <button data-tab="write">写作</button>
  <button data-tab="settings">设置</button>

<section id="today"></section>
<section id="words" hidden></section>
<section id="speak" hidden></section>
<section id="listen" hidden></section>
<section id="write" hidden></section>
<section id="settings" hidden></section>
</div>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("ket." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ket." + k, JSON.stringify(v)); } catch (e) {} }

function speakQueue(parts, onend) {
  if (!synth) { onend && onend(); return; }

  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    u.rate = settings.rate * (p.length <= 9 ? 0.85 : 1);

}

let activeRec = null, tickIv = null;
function makeRecorder(onStop) {
  let mr = null, chunks = [], stream = null, t0 = 0, iv = null;
  return {
    get live() { return !!mr && mr.state === "recording"; },
    async start(timerEl) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = []; mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop()); clearInterval(iv);
        const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
        onStop(URL.createObjectURL(blob), Math.round((Date.now() - t0) / 1000));
      };
      mr.start(); t0 = Date.now();
      iv = setInterval(() => { timerEl.textContent = fmtSec((Date.now() - t0) / 1000); }, 250);
    },
    stop() { if (mr && mr.state === "recording") mr.stop(); }
  };
}
function recWidget(holder, onUrl) {
  if (!holder) return;
  if (!window.MediaRecorder || !navigator.mediaDevices) { holder.innerHTML = `<p class="hint">这个浏览器不能录音，换 Chrome 或 Safari 试试。</p>`; return; }
  holder.innerHTML = `<div class="row"><button class="rec">🎙 录音</button><span class="timer">0:00</span></div><audio controls hidden></audio><p class="hint err" hidden></p>`;
  const b = $(".rec", holder), tm = $(".timer", holder), au = $("audio", holder), er = $(".err", holder);
  const r = makeRecorder((url, secs) => {
    b.classList.remove("live"); b.textContent = "🎙 重新录"; au.src = url; au.hidden = false;
    if (activeRec === r) activeRec = null;
    onUrl && onUrl(url, secs);
  });
  b.onclick = async () => {
    if (r.live) { r.stop(); return; }
    if (activeRec) activeRec.stop();
    stopSpeech();
    try { await r.start(tm); activeRec = r; b.classList.add("live"); b.textContent = "⏹ 停止"; er.hidden = true; }
    catch (e) { er.hidden = false; er.textContent = "麦克风用不了：请在浏览器里允许使用麦克风，再点一次。"; }
  };
}
function countdown(holder, secs) {
  holder.innerHTML = `<button class="cd">⏱ 开始 ${secs / 60} 分钟</button> <span class="timer"></span>`;
  const b = $(".cd", holder), t = $(".timer", holder);

}

    const it = r.items[r.i];
    h += `<div class="card">
      <div class="meta"><span>${r.i + 1} / ${r.items.length} · ${LTYPES[it.type].zh}</span><span>答对 ${r.right}</span></div>
      <div class="q">${esc(it.label)}</div>
      <input type="text" id="lIn" class="listen-in" autocomplete="off" autocapitalize="off" spellcheck="false" ${it.checked ? "disabled" : ""} placeholder="听完写在这里">
      <div class="row"><button data-a="play">🔊 再听</button>${it.checked ? `<button class="primary" data-a="next">${r.i === r.items.length - 1 ? "看成绩" : "下一题 →"}</button>` : `<button class="primary" data-a="check">检查</button>`}</div>
      ${it.checked ? `<div class="result ${it.ok ? "good" : "bad"}">${it.ok ? "✓ 对了！" : `✗ 答案是 <b>${esc(it.ans)}</b>（你写的：${esc(it.v) || "空"}）`}<div class="hint" style="margin-top:6px">原文：${esc(it.show)}</div></div>` : ""}
      <p class="hint">${esc(LTYPES[it.type].tip)}</p>
    </div>`;
  }
  el.innerHTML = h;
  $$("input[data-t]", el).forEach(c => c.onchange = () => { if (c.checked) lv.types.add(c.dataset.t); else lv.types.delete(c.dataset.t); store.set("ltypes", [...lv.types]); });
  const go = $("#lStart", el); if (go) go.onclick = () => {
    const types = [...lv.types]; if (!types.length) { alert("先勾至少一种题型"); return; }
    lv.round = { items: Array.from({ length: 10 }, () => GEN[rnd(types)]()), i: 0, right: 0 }; RENDER.listen();
  };
  const back = $("#lBack", el); if (back) back.onclick = () => { lv.round = null; RENDER.listen(); };
  if (!r || r.i >= r.items.length) return;
  const it = r.items[r.i], inp = $("#lIn", el);
  const check = () => {
    it.v = inp.value.trim(); it.ok = it.check(it.v); it.checked = true;
    if (it.ok) r.right++;
    const s = LS[it.type] || [0, 0]; s[0] += it.ok ? 1 : 0; s[1]++; LS[it.type] = s; store.set("ls", LS);
    stopSpeech(); RENDER.listen();
  };
  const next = () => { stopSpeech(); r.i++; RENDER.listen(); };
  $$("[data-a]", el).forEach(b => b.onclick = () => {
    const a = b.dataset.a; if (a === "play") playTwice(it.say); else if (a === "check") check(); else if (a === "next") next();
  });
  inp.onkeydown = e => { if (e.key === "Enter") { if (it.checked) next(); else check(); } };
  if (it.checked) { const n = $("#listen [data-a=next]"); if (n) { n.focus(); n.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); next(); } }; } }
  else { inp.focus(); playTwice(it.say); }
};

// ===== 写作 =====
const wt = { part: 6, i: 0, model: false };
RENDER.write = function () {
  renderSub();
  const el = $("#write"), list = wt.part === 6 ? W6 : W7, p = list[wt.i], key = `${wt.part}-${wt.i}`, need = wt.part === 6 ? 25 : 35;
  const text = DR[key] || "", n = countWords(text);
  const checks = wt.part === 6 ? [...p.pts, "开头有 Hi / Dear ＋ 名字，结尾署名"] : ["三幅图都写到了", "用的是过去时（went, saw, was…）", "写了结果或心情", "用了 First / Then / In the end 这类词"];
  const saved = WR.filter(w => w.part === wt.part && w.i === wt.i).length;
  let h = `<div class="seg"><button data-p="6" class="${wt.part === 6 ? "on" : ""}">⑥ 写邮件</button><button data-p="7" class="${wt.part === 7 ? "on" : ""}">⑦ 看图写故事</button></div>
    <div class="row"><select id="wSel" style="flex:1">${list.map((x, i) => `<option value="${i}" ${i === wt.i ? "selected" : ""}>${i + 1}. ${esc(x.title)}${WR.some(w => w.part === wt.part && w.i === i) ? " ✓" : ""}</option>`).join("")}</select><button id="wRnd">🎲 随机</button></div>
    <div class="card">
      <div class="meta"><span>${wt.part === 6 ? "第 6 部分 · 邮件或便条" : "第 7 部分 · 看图写故事"}</span>${saved ? `<span class="tag r3">写过 ${saved} 次</span>` : ""}</div>`;
  if (wt.part === 6) h += `<div class="task">${esc(p.task)}</div><p class="hint">要写到的三件事：${p.pts.map(esc).join(" / ")}</p>`;
  else h += `<div class="task">Look at the three pictures. Write the story shown in the pictures.\nWrite 35 words or more.</div>
      <div class="panels">${p.panels.map(([e, d], i) => `<div class="panel"><span class="no">图 ${i + 1}</span><div class="e">${e}</div><div class="d">${esc(d)}</div></div>`).join("")}</div>
      <p class="hint">可能用到的词：${esc(p.words)}</p>`;
  h += `<label class="lbl" for="wTxt">我写的（自动保存草稿）</label>
      <textarea id="wTxt" rows="7" spellcheck="false" placeholder="${wt.part === 6 ? "Hi …," : "One day, …"}">${esc(text)}</textarea>
      <div class="row"><span class="count" id="wCnt" style="color:${n >= need ? "var(--good)" : "var(--muted)"}">${n} 词 / 至少 ${need} 词</span></div>
      <div class="checks">${checks.map(c => `<label><input type="checkbox"> ${esc(c)}</label>`).join("")}</div>
      <div class="row">
        <button class="primary" data-a="save">保存这一篇</button>
        <button data-a="copy">📋 复制给 ChatGPT 批改</button>
        <button data-a="model">${wt.model ? "收起范文" : "写完再看范文"}</button>
      </div>
      <div class="hint" id="wMsg"></div>
      <div class="ref" ${wt.model ? "" : "hidden"}><h4>范文（${countWords(p.model)} 词）</h4><p class="ans">${esc(p.model)}</p></div>
    </div>`;
  const mine = WR.filter(w => w.part === wt.part);
  if (mine.length) h += `<div class="card"><h4 style="margin:0 0 6px">我写过的（第 ${wt.part} 部分，共 ${mine.length} 篇）</h4>${mine.map(w => `<details><summary>${new Date(w.t).toLocaleDateString("zh-CN")} · ${esc(w.title)} · ${w.n} 词</summary><p class="ans">${esc(w.text)}</p><button class="small" data-del="${w.t}">删掉</button></details>`).join("")}</div>`;
  el.innerHTML = h;
  $$(".seg button", el).forEach(b => b.onclick = () => { wt.part = Number(b.dataset.p); wt.i = 0; wt.model = false; RENDER.write(); });
  $("#wSel").onchange = e => { wt.i = Number(e.target.value); wt.model = false; RENDER.write(); };
  $("#wRnd").onclick = () => { wt.i = Math.floor(Math.random() * list.length); wt.model = false; RENDER.write(); };
  const ta = $("#wTxt"), cnt = $("#wCnt"), msg = $("#wMsg");
  ta.oninput = () => { DR[key] = ta.value; store.set("drafts", DR); const k = countWords(ta.value); cnt.textContent = `${k} 词 / 至少 ${need} 词`; cnt.style.color = k >= need ? "var(--good)" : "var(--muted)"; };
  $$("[data-del]", el).forEach(b => b.onclick = () => { if (!confirm("删掉这一篇？")) return; WR = WR.filter(w => String(w.t) !== b.dataset.del); store.set("wr", WR); RENDER.write(); });
  $$("[data-a]", el).forEach(b => b.onclick = () => {
    const a = b.dataset.a, v = ta.value.trim();
    if (a === "model") { wt.model = !wt.model; RENDER.write(); }
    else if (a === "save") {
      if (!v) { msg.textContent = "先写一点再保存哦。"; return; }
      WR.unshift({ part: wt.part, i: wt.i, title: p.title, text: v, n: countWords(v), t: Date.now() }); store.set("wr", WR);
      delete DR[key]; store.set("drafts", DR); RENDER.write(); $("#wMsg").textContent = rnd(PRAISE) + " 已保存。";
    } else if (a === "copy") {
      if (!v) { msg.textContent = "先写一点再复制。"; return; }
      const task = wt.part === 6 ? p.task : `看三幅图写故事（35 词以上）。图 1：${p.panels[0][1]}；图 2：${p.panels[1][1]}；图 3：${p.panels[2][1]}。`;
      const txt = `你是剑桥 A2 Key for Schools 的写作老师。下面是我写的第 ${wt.part} 部分${wt.part === 6 ? "邮件" : "看图故事"}，题目是：\n${task}\n\n我写的：\n${v}\n\n${GPT_ASK}`;
      copyText(txt).then(ok => { msg.textContent = ok ? "已复制。打开 ChatGPT，粘贴发送就行。" : "复制没成功，可以手动全选文字复制。"; });
    }
  });
};
function copyText(t) {
  const fallback = () => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} a.remove(); return ok; };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(() => true, () => fallback());
  return Promise.resolve(fallback());
}

// ===== 设置 =====
RENDER.settings = function () {
  renderSub();
  const el = $("#settings");
  el.innerHTML = `<div class="card">
    <div class="row"><label style="min-width:72px">语速</label><input type="range" id="sRate" min="0.6" max="1.1" step="0.05" value="${settings.rate}"><span class="hint" id="sRateV">${settings.rate.toFixed(2)}</span></div>
    <div class="row"><label style="min-width:72px">声音</label><select id="sVoice" style="flex:1">${voices.length ? voices.map(v => `<option ${v.name === settings.voice ? "selected" : ""}>${esc(v.name)}</option>`).join("") : "<option>（没找到英文声音）</option>"}</select><button id="sTest">试听</button></div>
    <p class="hint">剑桥考试多是英式口音，带 en-GB 的声音（比如 Daniel）更像真考试。</p>
    <div class="row"><label><input type="checkbox" id="sListen" ${settings.listenOnly ? "checked" : ""}> 口语题只听不看（题目文字先模糊，点「看题目」才显示）</label></div>
  </div>
  <div class="card">
    <div class="row"><label style="min-width:72px">开始日期</label><input type="date" id="sStart" value="${settings.start}"></div>
    <div class="row"><label style="min-width:72px">考试日期</label><input type="date" id="sExam" value="${settings.exam}"><span class="hint">定了就填，顶上会倒计时</span></div>
  </div>
  <div class="card">
    <p class="hint">进度只存在这台电脑的这个浏览器里。换电脑前先导出，到新电脑上导入。</p>
    <div class="row"><button id="sExport">导出进度</button><label class="small" style="border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer">导入进度<input type="file" id="sImport" accept=".json,application/json" hidden></label></div>
    <div class="row"><button id="sReset" style="color:var(--bad)">清空所有记录</button></div>
  </div>`;
  $("#sRate").oninput = e => { settings.rate = Number(e.target.value); $("#sRateV").textContent = settings.rate.toFixed(2); saveSettings(); };
  $("#sVoice").onchange = e => { settings.voice = e.target.value; saveSettings(); };
  $("#sTest").onclick = () => speak("Hello! Let's practise for the Key exam. Can you spell your name, please?");
  $("#sListen").onchange = e => { settings.listenOnly = e.target.checked; saveSettings(); };
  $("#sStart").onchange = e => { if (e.target.value) { settings.start = e.target.value; saveSettings(); renderSub(); } };
  $("#sExam").onchange = e => { settings.exam = e.target.value; saveSettings(); renderSub(); };
  $("#sExport").onclick = () => {
    const data = {}; ["settings", "done", "words", "sp", "my", "ls", "wr", "drafts", "ltypes"].forEach(k => data[k] = store.get(k, null));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
    a.download = `KET 进度 ${new Date().toISOString().slice(0, 10)}.json`; a.click();
  };
  $("#sImport").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); Object.keys(d).forEach(k => { if (d[k] != null) store.set(k, d[k]); }); location.reload(); }).catch(() => alert("这个文件读不出来。"));
  };
  $("#sReset").onclick = () => {
    if (!confirm("清空所有打卡、单词、口语、听力和作文记录？清空后找不回来。")) return;
    ["done", "words", "sp", "my", "ls", "wr", "drafts"].forEach(k => store.set(k, k === "wr" ? [] : {}));
    location.reload();
  };
};

showTab(store.get("tab", "today"));
})();
</script>
